# SuperMXMai 单机部署：web 静态 + /api 反代 gateway
# 安装：scripts/install-nginx-site.sh
#
# 结构说明（certbot 申请 SSL 后勿让 certbot 覆盖 :80 IP 访问）：
#   - mxm-ai.com :80  → 301 到 HTTPS
#   - IP / default :80 → Admin SPA（避免 certbot 的 return 404）
#   - :443            → Admin SPA + API（域名 + IP）

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream supermxmai_gateway {
    server 127.0.0.1:3000;
    keepalive 32;
}

# 域名 HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mxm-ai.com www.mxm-ai.com;
    return 301 https://$host$request_uri;
}

# IP / 默认 HTTP → Admin（certbot 勿在此块写 return 404）
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 8.218.14.129 _;

    root /opt/supermxmai/web/dist;
    index index.html;

    include /etc/nginx/snippets/supermxmai-app.inc;
}

# HTTPS（certbot 证书路径在首次 setup-ssl-hk 后写入）
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mxm-ai.com www.mxm-ai.com 8.218.14.129 _;

    ssl_certificate /etc/letsencrypt/live/mxm-ai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mxm-ai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/supermxmai/web/dist;
    index index.html;

    include /etc/nginx/snippets/supermxmai-app.inc;
}
