# Admin Web 国内入口（8.136.186.242:8080）→ 香港主力 Gateway / mxmnotify
# H5 仍占用 :80，Admin 使用 :8080

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream hk_gateway {
    server 8.218.14.129:443;
    keepalive 16;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _ 8.136.186.242 mxm-ai.com www.mxm-ai.com;

    root /opt/supermxmai/web/dist;
    index index.html;

    client_max_body_size 100m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/xml
        image/svg+xml;

    location ~* ^/assets/.+\.mjs$ {
        default_type application/javascript;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* ^/assets/.+\.(js|css|woff2?|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /health {
        proxy_pass https://hk_gateway/health;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name mxm-ai.com;
        proxy_set_header Host mxm-ai.com;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/v1/ws/notifications {
        gzip off;
        proxy_buffering off;
        proxy_pass https://hk_gateway/api/v1/ws/notifications;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name mxm-ai.com;
        proxy_set_header Host mxm-ai.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        gzip off;
        proxy_buffering off;
        proxy_pass https://hk_gateway;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name mxm-ai.com;
        proxy_set_header Host mxm-ai.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
